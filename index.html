<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="./app-icon.png" />
    <title>兴风作浪 · V1.1.0</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-width: 100%;
        min-height: 100%;
        overflow: hidden;
        background: #111;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #game-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      
      html.native-android #game-container canvas {
        max-width: none !important;
        max-height: none !important;
        margin: 0 !important;
      }
      body {
        touch-action: none;
        overscroll-behavior: none;
      }
      #boot-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 44%, #17344a 0%, #0a1520 50%, #050a0f 100%);
        color: #f3fbff;
        transition: opacity 220ms ease;
        pointer-events: none;
      }
      #boot-loading.boot-loading-complete {
        opacity: 0;
      }
      #boot-loading.boot-loading-hidden {
        display: none;
      }
      .boot-loading-card {
        width: min(72vw, 420px);
        text-align: center;
      }
      .boot-loading-title {
        font-size: clamp(26px, 5vw, 40px);
        font-weight: 800;
        letter-spacing: 0.14em;
        text-shadow: 0 0 18px rgba(148, 213, 243, 0.32);
      }
      .boot-loading-copy {
        margin-top: 12px;
        font-size: 14px;
        color: #b9d9ea;
      }
      .boot-wave {
        display: flex;
        height: 30px;
        margin: 20px auto 16px;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .boot-wave span {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #94d5f3;
        box-shadow: 0 0 12px rgba(148, 213, 243, 0.7);
        animation: boot-wave 0.86s ease-in-out infinite alternate;
      }
      .boot-wave span:nth-child(2) { animation-delay: 0.12s; }
      .boot-wave span:nth-child(3) { animation-delay: 0.24s; }
      .boot-wave span:nth-child(4) { animation-delay: 0.36s; }
      .boot-wave span:nth-child(5) { animation-delay: 0.48s; }
      @keyframes boot-wave {
        from { transform: translateY(8px) scale(0.78); opacity: 0.45; }
        to { transform: translateY(-8px) scale(1.16); opacity: 1; }
      }
      .boot-loading-track {
        height: 8px;
        overflow: hidden;
        border: 1px solid rgba(148, 213, 243, 0.38);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.36);
      }
      #boot-loading-fill {
        width: 100%;
        height: 100%;
        transform: scaleX(0);
        transform-origin: left center;
        background: linear-gradient(90deg, #4d8fb2 0%, #94d5f3 72%, #e7fbff 100%);
        transition: transform 90ms linear;
      }
      #boot-loading-percent {
        margin-top: 8px;
        font-size: 13px;
        color: #94d5f3;
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CIu2gV6t.js"></script>
  </head>
  <body>
    <div id="boot-loading" aria-live="polite">
      <div class="boot-loading-card">
        <div class="boot-loading-title">兴风作浪</div>
        <div class="boot-loading-copy">正在兴风作浪……资源加载中</div>
        <div class="boot-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="boot-loading-track"><div id="boot-loading-fill"></div></div>
        <div id="boot-loading-percent">0%</div>
      </div>
    </div>
    <div id="game-container"></div>
  </body>
</html>
